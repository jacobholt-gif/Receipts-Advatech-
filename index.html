<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AdvaTech Expenses</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #111827;
    --accent-hover: #000;
    --green: #059669;
    --red: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    height: 28px;
  }
  .header h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 12px 0;
  }
  label {
    display: block;
    font-weight: 500;
    font-size: 0.95rem;
    margin: 14px 0 6px 0;
  }
  input, select, textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    background: #fff;
    outline: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }
  textarea { min-height: 70px; resize: vertical; }
  .photo-box {
    border: 2px dashed #d1d5db;
    border-radius: 12px;
    padding: 28px 16px;
    text-align: center;
    background: #fafafa;
    cursor: pointer;
  }
  .photo-box strong { display: block; margin-bottom: 4px; }
  .photo-box span { color: var(--muted); font-size: 0.9rem; }
  .photo-box input { display: none; }
  .preview {
    margin-top: 12px;
    max-width: 100%;
    border-radius: 10px;
    display: none;
  }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > div { flex: 1; }
  button.primary {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    padding: 16px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 12px;
    margin-top: 8px;
    cursor: pointer;
  }
  button.primary:active { background: var(--accent-hover); }
  .note {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    margin-top: 14px;
    line-height: 1.4;
  }
  .success {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .ocr-status {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
    min-height: 20px;
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<div class="header">
  <img class="logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAABkCAYAAAA8AQ3AAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH6AkLEz0nB8qKAAAAD3RFWHRBdXRob3IAbWFnaWNranVtcGVyAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH6AkLEz0nB8qKAAAAD3RFWHRBdXRob3IAbWFnaWNranVtcGVy" alt="AdvaTech" style="display:none">
  <div>
    <h1>AdvaTech Expenses</h1>
  </div>
</div>

<div class="container">
  <form id="expenseForm">
    <div class="card">
      <div class="section-title">Receipt</div>
      <div class="photo-box" onclick="document.getElementById('photo').click()">
        <strong>Take or upload receipt</strong>
        <span>Clear photo of the full receipt</span>
        <input type="file" id="photo" accept="image/*" capture="environment" required>
        <img id="preview" class="preview" alt="Receipt preview">
        <div id="ocrStatus" class="ocr-status"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Details</div>

      <label>Amount *</label>
      <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>

      <div class="row">
        <div>
          <label>Date *</label>
          <input type="date" id="date" required>
        </div>
        <div>
          <label>Vendor *</label>
          <input type="text" id="vendor" list="vendorList" placeholder="Search vendor..." required autocomplete="off">
          <datalist id="vendorList"></datalist>
        </div>
      </div>

      <label>Category *</label>
      <input type="text" id="category" list="categoryList" placeholder="Search category..." required autocomplete="off">
      <datalist id="categoryList"></datalist>

      <label>Description *</label>
      <input type="text" id="description" placeholder="What was purchased?" required>

      <label>Job / Customer (optional)</label>
      <input type="text" id="job" placeholder="Job name, customer, or PO">

      <label>Payment Account</label>
      <select id="payment">
        <option value="Chase INK Visa Credit Card" selected>Chase INK Visa Credit Card</option>
      </select>
    </div>

    <button type="submit" class="primary">Submit Expense</button>
    <p class="note">This prepares the receipt with all fields filled for review and posting in QuickBooks.</p>
  </form>

  <div class="success" id="success">
    <h2>Submitted</h2>
    <p>Your expense is ready for review.<br>Attach the photo if prompted and send.</p>
    <button class="primary" style="margin-top:20px" onclick="location.reload()">Submit Another</button>
  </div>
</div>

// Set today's date by default
document.getElementById('date').valueAsDate = new Date();

const photoInput = document.getElementById('photo');
const preview = document.getElementById('preview');

photoInput.addEventListener('change', async function() {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    preview.src = e.target.result;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);

  // Run OCR
  const status = document.getElementById('ocrStatus');
  status.textContent = 'Reading receipt...';

  try {
    const { data: { text } } = await Tesseract.recognize(file, 'eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          status.textContent = `Reading... ${Math.round(m.progress * 100)}%`;
        }
      }
    });

    status.textContent = 'Extracted. Please review and correct if needed.';

    // Try to extract amount (look for TOTAL, amount patterns)
    const amountMatch = text.match(/(?:total|amount|due)[:\s]*\$?\s*(\d+\.\d{2})/i) ||
                        text.match(/\$\s*(\d+\.\d{2})/);
    if (amountMatch) {
      document.getElementById('amount').value = parseFloat(amountMatch[1]).toFixed(2);
    }

    // Try to extract date
    const dateMatch = text.match(/(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/) ||
                      text.match(/(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})/);
    if (dateMatch) {
      let d = dateMatch[1];
      // Normalize to YYYY-MM-DD if possible
      const parts = d.split(/[\/\-]/);
      if (parts.length === 3) {
        let [a, b, c] = parts;
        if (a.length === 4) {
          // already YYYY-MM-DD style
          document.getElementById('date').value = `${a}-${b.padStart(2,'0')}-${c.padStart(2,'0')}`;
        } else if (c.length === 4) {
          // MM/DD/YYYY
          document.getElementById('date').value = `${c}-${a.padStart(2,'0')}-${b.padStart(2,'0')}`;
        } else if (c.length === 2) {
          const year = parseInt(c) > 50 ? '19' + c : '20' + c;
          document.getElementById('date').value = `${year}-${a.padStart(2,'0')}-${b.padStart(2,'0')}`;
        }
      }
    }

    // Vendor: take first non-empty line that looks like a name (not a date/number)
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 2);
    for (const line of lines.slice(0, 5)) {
      if (!/\d{1,2}[\/\-]\d{1,2}/.test(line) && !/^\$?\d/.test(line) && line.length < 40) {
        document.getElementById('vendor').value = line;
        break;
      }
    }

  } catch (err) {
    status.textContent = 'Could not read receipt. Please fill fields manually.';
    console.error(err);
  }
});

document.getElementById('expenseForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const amount = document.getElementById('amount').value;
  const date = document.getElementById('date').value;
  const vendor = document.getElementById('vendor').value.trim();
  const category = document.getElementById('category').value;
  const description = document.getElementById('description').value.trim();
  const job = document.getElementById('job').value.trim();
  const payment = document.getElementById('payment').value;

  if (!amount || !date || !vendor || !category || !description) {
    alert('Please fill in all required fields.');
    return;
  }

  // Build body with key fields clearly labeled for QuickBooks
  let body = `AMOUNT: $${parseFloat(amount).toFixed(2)}\n`;
  body += `PAYEE: ${vendor}\n`;
  body += `DESCRIPTION: ${description}\n`;
  body += `PAYMENT DATE: ${date}\n`;
  body += `Category: ${category}\n`;
  if (job) body += `Job/Customer: ${job}\n`;
  if (payment) body += `Payment Account: ${payment}\n`;
  body += `\n(Attach receipt photo before sending)`;

  const subject = `Receipt - ${vendor} - $${parseFloat(amount).toFixed(2)} - ${category}`;
  const mailto = `mailto:advatech_systems+expenses@assist.intuit.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  window.location.href = mailto;

  // Show success after a short delay
  setTimeout(() => {
    document.getElementById('expenseForm').style.display = 'none';
    document.getElementById('success').style.display = 'block';
  }, 800);
});
</script>
