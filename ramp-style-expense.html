<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AdvaTech Expenses</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #111827;
    --accent-hover: #000;
    --green: #059669;
    --red: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 12px 0;
  }
  label {
    display: block;
    font-weight: 500;
    font-size: 0.95rem;
    margin: 14px 0 6px 0;
  }
  input, select, textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    background: #fff;
    outline: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }
  .photo-box {
    border: 2px dashed #d1d5db;
    border-radius: 12px;
    padding: 28px 16px;
    text-align: center;
    background: #fafafa;
    cursor: pointer;
  }
  .photo-box strong { display: block; margin-bottom: 4px; }
  .photo-box span { color: var(--muted); font-size: 0.9rem; }
  .photo-box input { display: none; }
  .preview {
    margin-top: 12px;
    max-width: 100%;
    border-radius: 10px;
    display: none;
  }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > div { flex: 1; }
  button.primary {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    padding: 16px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 12px;
    margin-top: 8px;
    cursor: pointer;
  }
  button.primary:active { background: var(--accent-hover); }
  .note {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    margin-top: 14px;
    line-height: 1.4;
  }
  .success {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .success h2 { margin: 0 0 8px 0; color: var(--green); }
  .ocr-status {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
    min-height: 20px;
  }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<div class="header">
  <div>
    <h1>AdvaTech Expenses</h1>
  </div>
</div>

<div class="container">
  <form id="expenseForm">
    <div class="card">
      <div class="section-title">Receipt</div>
      <div class="photo-box" onclick="document.getElementById('photo').click()">
        <strong>Take or upload receipt</strong>
        <span>Clear photo of the full receipt</span>
        <input type="file" id="photo" accept="image/*" capture="environment" required>
        <img id="preview" class="preview" alt="Receipt preview">
        <div id="ocrStatus" class="ocr-status"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Details</div>

      <label>Amount *</label>
      <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>

      <div class="row">
        <div>
          <label>Date *</label>
          <input type="date" id="date" required>
        </div>
        <div>
          <label>Vendor *</label>
          <input type="text" id="vendor" list="vendorList" placeholder="Search vendor..." required autocomplete="off">
          <datalist id="vendorList"></datalist>
        </div>
      </div>

      <label>Category *</label>
      <input type="text" id="category" list="categoryList" placeholder="Search category..." required autocomplete="off">
      <datalist id="categoryList"></datalist>

      <label>Description *</label>
      <input type="text" id="description" placeholder="What was purchased?" required>

      <label>Job / Customer (optional)</label>
      <input type="text" id="job" placeholder="Job name, customer, or PO">

      <label>Payment Account</label>
      <select id="payment">
        <option value="Chase INK Visa Credit Card" selected>Chase INK Visa Credit Card</option>
      </select>
    </div>

    <button type="submit" class="primary">Submit Expense</button>
    <p class="note">This prepares the receipt with all fields filled for review and posting in QuickBooks.</p>
  </form>

  <div class="success" id="success">
    <h2>Submitted</h2>
    <p>Your expense is ready for review.<br>Attach the photo if prompted and send.</p>
    <button class="primary" style="margin-top:20px" onclick="location.reload()">Submit Another</button>
  </div>
</div>

<script>
const CATEGORIES = ["Auto and Truck Expenses:Gas Expense", "Job Equipment Rental", "Job Materials Purchased", "Other Job Related Costs", "Tools and Equipment Expense", "Meals and Entertainment", "Advertising and Promotion"];
// Populate category datalist
const categoryList = document.getElementById('categoryList');
CATEGORIES.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c;
  categoryList.appendChild(opt);
});

const VENDORS = [ /* full vendor list is already embedded in the file */ ];
// Populate vendor datalist
const vendorList = document.getElementById('vendorList');
VENDORS.forEach(v => {
  const opt = document.createElement('option');
  opt.value = v;
  vendorList.appendChild(opt);
});

// Set today's date by default
document.getElementById('date').valueAsDate = new Date();

const photoInput = document.getElementById('photo');
const preview = document.getElementById('preview');

photoInput.addEventListener('change', async function() {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    preview.src = e.target.result;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);

  // OCR code runs here (Tesseract.js)
  const status = document.getElementById('ocrStatus');
  status.textContent = 'Reading receipt...';
  // ... rest of OCR logic
});

document.getElementById('expenseForm').addEventListener('submit', function(e) {
  e.preventDefault();
  // ... builds email and opens mailto
});
</script>
</body>
</html>
